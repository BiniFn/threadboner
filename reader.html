  <style>

:not-allowed}.status-box{color:var(--muted);border:1px dashed var(--line);padding:16px}.status-box.error{color:#ff9288}.reader{position:fixed;inset:0;z-index:10;background:#0b0b0d;display:flex;flex-direction:column}.reader[hidden]{display:none}.reader-top{min-height:66px;display:flex;align-items:center;gap:18px;padding:9px 18px;border-bottom:1px solid var(--line);background:#101012}.reader-title{font:700 clamp(1rem,2vw,1.5rem) Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 auto 0 0}.reader-actions{display:flex;gap:8px}.reader-actions a,.reader-actions button,.tool,.page-input{border:1px solid var(--line);background:#141416;color:var(--ink);padding:8px 11px;text-decoration:none}.reader-actions .primary{border-color:#6b2929}.toolbar{min-height:54px;display:flex;align-items:center;justify-content:center;gap:7px;padding:7px 12px;background:#1b1b1d;border-bottom:1px solid #39383a;overflow-x:auto}.tool{min-width:38px;height:38px;padding:5px 10px;font-size:.78rem}.tool:hover,.reader-actions button:hover,.reader-actions a:hover{border-color:#9d4444;background:#262123}.tool:disabled{opacity:.38;cursor:not-allowed}.tool-sep{height:26px;border-left:1px solid #4a4848;margin:0 5px}.page-input{width:58px;text-align:center;padding:7px 4px}.page-total,.zoom-value{min-width:52px;text-align:center;color:#f4f0e8}.zoom-value{min-width:48px}.search-wrap{display:flex;align-items:center;gap:6px}.search-input{width:150px;padding:8px;background:#111113;border:1px solid #464144;color:var(--ink)}.reader-status{font-size:.65rem;color:var(--muted);min-width:60px}.progress-track{height:3px;background:#302c2c}.progress-bar{height:100%;width:0;background:var(--red);transition:width .12s linear}.reader-main{display:flex;min-height:0;flex:1}.thumbnails{width:245px;flex:none;overflow:auto;background:#171719;border-right:1px solid #393638;padding:14px;display:none}.reader.show-thumbnails .thumbnails{display:block}.thumb{display:block;width:100%;border:1px solid transp     main{padding-bottom:92px}#bgm{display:none}#yt-host{position:fixed;width:2px;height:2px;opacity:.001;pointer-events:none;left:-10px;top:-10px;overflow:hidden}
    .reader{inset:0 0 58px}.bar{position:fixed;bottom:0;left:0;right:0;z-index:20;min-height:58px;display:flex;align-items:center;gap:8px;padding:8px 16px;background:#08080a;border-top:1px solid var(--line)}.bar-l,.bar-r{display:flex;align-items:center;gap:7px;flex:1}.bar-r{justify-content:flex-end}.bar-l>a{font-size:.65rem;color:var(--muted);text-decoration:none;letter-spacing:.08em}.ib{width:36px;height:36px;border-radius:3px;background:#111113;border:1px solid var(--line);color:var(--muted);cursor:pointer;display:grid;place-items:center;flex:none}.ib:hover{color:var(--ink);border-color:var(--muted)}.ib:focus-visible{outline:2px solid var(--red);outline-offset:2px}.ib svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}.sound-btn{position:relative}.sound-btn .i-pause{display:none}.sound-btn.playing .i-pause{display:block}.sound-btn.playing .i-play{display:none}.sound-btn .bars{position:absolute;bottom:4px;display:flex;gap:2px;align-items:flex-end;height:6px;opacity:0}.sound-btn.playing .bars{opacity:1}.bars i{display:block;width:2px;height:3px;background:var(--red)}.sound-btn.playing .bars i{animation:eq .9s ease-in-out infinite}.bars i:nth-child(2){height:6px;animation-delay:.18s}@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}.sound-btn.blocked{border-style:dashed;border-color:var(--red)}.track{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase}.track[href]{color:var(--ink)}#nextBtn svg{width:15px;height:15px}
    @media(max-width:430px){main{padding-bottom:80px}.bar{padding:7px 10px}.bar-l>a{font-size:.58rem}.track{max-width:115px;font-size:.55rem}.reader{inset:0 0 54px}.bar{min-height:54px}}

<body>
  <header class="site-header"><a class="brand" href="/">THREADBONER</a><a href="/">← Back to archive entrance</a></header>
  <audio id="bgm" loop preload="none" playsinline></audio>
  <div id="yt-host" aria-hidden="true"></div>
  <main>
    <section class="intro"><h1>The Reader</h1><p>Released volumes appear here at their scheduled premiere. Open a volume for a clean, page-by-page reading experience.</p></section>
    <div class="archive-tools"><label for="filter">Volume archive</label><input id="filter" type="search" placeholder="Filter by title or volume" autocomplete="off"></div>
    <section id="volumes" class="volume-grid" aria-live="polite" aria-busy="true"><p class="status-box">Loading the release archive…</p></section>
    <footer>Threadboner © 2026 BiniFn · All Rights Reserved</footer>
  </main>
  <section id="reader" class="reader" aria-label="PDF reader" aria-hidden="true" hidden>
    <header class="reader-top"><h2 id="reader-title" class="reader-title"></h2><div class="reader-actions"><button id="close-reader" type="button">Close</button></div></header>
    <nav class="toolbar" aria-label="PDF controls">
      <button class="tool" id="thumb-toggle" type="button" aria-label="Toggle page thumbnails" title="Thumbnails">▤</button><span class="tool-sep"></span>
      <button class="tool" id="prev-page" type="button" aria-label="Previous page" title="Previous page">‹</button>
      <input class="page-input" id="page-number" aria-label="Current page" inputmode="numeric" value="1"><span class="page-total">/ <span id="page-count">—</span></span>
      <button class="tool" id="next-page" type="button" aria-label="Next page" title="Next page">›</button><span class="tool-sep"></span>
      <button class="tool" id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button><span class="zoom-value" id="zoom-label">Fit page</span><button class="tool" id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
      <button class="tool" id="fit-page" type="button" aria-label="Fit page to screen" title="Fit page">□</button><button class="tool" id="rotate" type="button" aria-label="Rotate pages" title="Rotate">↻</button><span class="tool-sep"></span>
      <div class="search-wrap"><input id="search" class="search-input" type="search" aria-label="Search this volume" placeholder="Find in volume"><button id="find-next" class="tool" type="button" aria-label="Find next match" title="Find next">⌕</button></div>
      <span class="reader-status" id="reader-status" role="status" aria-live="polite"></span><span class="tool-sep"></span>
      <button class="tool" id="fullscreen" type="button" aria-label="Fullscreen" title="Fullscreen">⛶</button>
    </nav>
    <div class="progress-track" aria-hidden="true"><div id="progress" class="progress-bar"></div></div>
    <div class="reader-main">
      <aside id="thumbnails" class="thumbnails" aria-label="Page thumbnails"></aside>
      <div id="pages-scroll" class="pages-scroll" tabindex="0" aria-label="PDF pages"><div id="pages" class="pages"><div class="reader-empty"><div class="reader-loading"><span class="spinner"></span>Loading volume…</div></div></div></div>
    </div>
  </section>
  <div class="bar" aria-label="Site soundtrack">
    <div class="bar-l"><a href="/">THREADBONER</a></div>
    <div class="bar-r">
      <a class="track" id="trackName" href="#" target="_blank" rel="noopener" title="Open this track on YouTube"></a>
      <button class="ib" id="nextBtn" aria-label="Next track" title="Next track"><svg class="i-next" viewBox="0 0 24 24"><path d="M6 5l9 7-9 7zM17 5v14"/></svg></button>
      <button class="ib sound-btn" id="soundBtn" aria-label="Play soundtrack" aria-pressed="false"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5l11 6.5-11 6.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span></button>
    </div>
  </div>
  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.worker.mjs";

    const $ = (selector) => document.querySelector(selector);
    const list = $("#volumes"), filter = $("#filter"), reader = $("#reader"), scroller = $("#pages-scroll"), pages = $("#pages"), thumbs = $("#thumbnails");
    const state = { releases: [], pdf: null, loadingTask: null, item: null, scale: 1, fit: "page", rotation: 0, page: 1, observer: null, rendering: new Map(), pageRenders: new Map(), renderQueues: new Map(), rendered: new Set(), searchMatches: [], searchIndex: -1, zoom: 1 };
    const dateFormat = new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" });
    const status = (message) => { $("#reader-status").textContent = message; };
    const savedPageKey = (id) => `threadborn-reader-page:${id}`;
    function trackSiteEvent(eventType, volumeId) {
      try {
        let visitorId = localStorage.getItem("threadborn_visitor_id");
        if (!visitorId) {
          visitorId = crypto.randomUUID();
          localStorage.setItem("threadborn_visitor_id", visitorId);
        }
        fetch("/api/site-analytics", {
          method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
          body: JSON.stringify({ visitorId, eventType, pagePath: "/reader.html", ...(volumeId ? { volumeId } : {}) }),
        }).catch(() => {});
      } catch {}
    }
    trackSiteEvent("page_view");
    trackSiteEvent("reader_view");

    function drawVolumes() {
      const query = filter.value.trim().toLowerCase();
      const rows = state.releases.filter((item) => (`volume ${item.volumeNumber} ${item.title}`).toLowerCase().includes(query));
      if (!rows.length) {
        const empty = document.createElement("p"); empty.className = "status-box"; empty.textContent = state.releases.length ? "No volumes match that filter." : "No volumes have premiered yet. Check back when the first release opens.";
        list.replaceChildren(empty); return;
      }
      list.replaceChildren(...rows.map((item) => {
        const card = document.createElement("article"); card.className = "card";
        const eyebrow = document.createElement("div"); eyebrow.className = "eyebrow"; eyebrow.textContent = `Volume ${item.volumeNumber}`;
        const title = document.createElement("h2"); title.textContent = item.title;
        const date = document.createElement("p"); date.className = "date"; date.textContent = `Premieres ${dateFormat.format(new Date(item.premiereAt))}`;
        const stateText = document.createElement("p"); stateText.className = `state${item.released ? "" : " wait"}`; stateText.textContent = item.released ? "Available to read" : "Scheduled";
        const button = document.createElement("button"); button.type = "button"; button.disabled = !item.released; button.textContent = item.released ? "Read volume" : "Not released yet"; button.addEventListener("click", () => openVolume(item));
        card.append(eyebrow, title, date, stateText, button); return card;
      }));
    }

    async function loadVolumes() {
      list.setAttribute("aria-busy", "true");
      try {
        const response = await fetch("/api/reader/volumes", { cache: "no-store" });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.success) throw new Error(result.error || "Could not load releases.");
        state.releases = result.data.releases || []; drawVolumes();
      } catch (error) {
        const message = document.createElement("p"); message.className = "status-box error"; message.textContent = error?.message || "Reader unavailable."; list.replaceChildren(message);
      } finally { list.setAttribute("aria-busy", "false"); }
    }

    function setReaderOpen(open) {
      reader.hidden = !open; reader.setAttribute("aria-hidden", String(!open)); document.body.classList.toggle("reader-open", open);
      if (open) { history.replaceState(null, "", `#volume-${state.item.id}`); $("#close-reader").focus(); }
      else { history.replaceState(null, "", location.pathname + location.search); cleanupDocument(); }
    }

    function cleanupDocument() {
      state.observer?.disconnect(); state.observer = null;
      for (const task of state.pageRenders.values()) task.cancel();
      state.pageRenders.clear();
      if (state.loadingTask) state.loadingTask.destroy().catch(() => {});
      state.loadingTask = null; state.pdf = null; state.rendering.clear(); state.rendered.clear(); state.searchMatches = [];
      pages.replaceChildren(); thumbs.replaceChildren(); reader.classList.remove("show-thumbnails");
    }

    async function openVolume(item) {
      state.item = item; state.page = Number(localStorage.getItem(savedPageKey(item.id))) || 1; state.zoom = 1; state.rotation = 0; state.fit = "page"; $("#zoom-label").textContent = "Fit page";
      $("#reader-title").textContent = `Volume ${item.volumeNumber} · ${item.title}`; status("Loading PDF…");
      pages.replaceChildren(Object.assign(document.createElement("div"), { className: "reader-empty", textContent: "Loading volume…" })); setReaderOpen(true);
      try {
        const response = await fetch(`/api/reader/volumes?id=${encodeURIComponent(item.id)}`, { cache: "no-store" });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.success) throw new Error(result.error || "This volume is not available yet.");
        const pdfUrl = result.data.volume.url;
        state.loadingTask = pdfjsLib.getDocument({ url: pdfUrl, withCredentials: true });
        state.pdf = await state.loadingTask.promise;
        $("#page-count").textContent = state.pdf.numPages;
        await buildPageSlots();
        state.page = Math.min(Math.max(state.page, 1), state.pdf.numPages); $("#page-number").value = state.page;
        scrollToPage(state.page, false); renderVisiblePages(); status(`${state.pdf.numPages} pages`);
        trackSiteEvent("volume_open", item.id);
      } catch (error) {
        const box = document.createElement("div"); box.className = "reader-error";
        const heading = document.createElement("strong"); heading.textContent = "This volume could not be opened.";
        const message = document.createElement("p"); message.textContent = error?.message || "The PDF could not be loaded.";
        box.append(heading, message); pages.replaceChildren(box); status("Unable to load");
      }
    }

    async function buildPageSlots() {
      state.observer?.disconnect(); state.rendering.clear(); state.rendered.clear(); pages.replaceChildren(); thumbs.replaceChildren();
      const fragment = document.createDocumentFragment();
      for (let number = 1; number <= state.pdf.numPages; number += 1) {
        const page = await state.pdf.getPage(number); const viewport = page.getViewport({ scale: 1, rotation: state.rotation });
        const slot = document.createElement("article"); slot.className = "page-slot"; slot.dataset.page = number; slot.style.width = `${scroller.clientWidth}px`; slot.style.height = "100%";
        const canvas = document.createElement("canvas"); canvas.setAttribute("aria-label", `Page ${number}`);
        const loading = document.createElement("div"); loading.className = "page-loading"; loading.textContent = `Page ${number}`; slot.append(canvas, loading); fragment.append(slot);
      }
      pages.append(fragment);
      state.observer = new IntersectionObserver((entries) => {
        for (const entry of entries) if (entry.isIntersecting) renderSlot(Number(entry.target.dataset.page));
      }, { root: scroller, rootMargin: "0px 1000px" });
      pages.querySelectorAll(".page-slot").forEach((slot) => state.observer.observe(slot));
      renderThumbnails();
    }

    async function renderPage(number, targetCanvas, scale, rotation = state.rotation) {
      const previous = state.renderQueues.get(targetCanvas) || Promise.resolve();
      let release;
      const gate = new Promise((resolve) => { release = resolve; });
      const queued = previous.catch(() => {}).then(() => gate);
      state.renderQueues.set(targetCanvas, queued);
      await previous.catch(() => {});
      try {
        const pdfPage = await state.pdf.getPage(number); const viewport = pdfPage.getViewport({ scale, rotation });
        const ratio = window.devicePixelRatio || 1; targetCanvas.width = Math.floor(viewport.width * ratio); targetCanvas.height = Math.floor(viewport.height * ratio);
        targetCanvas.style.width = `${viewport.width}px`; targetCanvas.style.height = `${viewport.height}px`;
        const context = targetCanvas.getContext("2d", { alpha: false });
        const task = pdfPage.render({ canvasContext: context, viewport, transform: ratio === 1 ? null : [ratio, 0, 0, ratio, 0, 0] });
        state.pageRenders.set(targetCanvas, task);
        try { await task.promise; }
        finally { if (state.pageRenders.get(targetCanvas) === task) state.pageRenders.delete(targetCanvas); }
        return viewport;
      } finally {
        release();
        if (state.renderQueues.get(targetCanvas) === queued) state.renderQueues.delete(targetCanvas);
      }
    }

    function availableWidth() { return Math.max(250, Math.min(scroller.clientWidth - (window.innerWidth < 700 ? 16 : 52), 1100)); }
    async function renderAround(number) {
      if (!state.pdf) return;
      const start = Math.max(1, number - 2), end = Math.min(state.pdf.numPages, number + 2);
      for (let page = start; page <= end; page += 1) renderSlot(page);
    }
    async function renderSlot(number) {
      if (!state.pdf || state.rendered.has(number) || state.rendering.has(number)) return state.rendering.get(number);
      const slot = pages.querySelector(`[data-page="${number}"]`); if (!slot) return;
      const promise = (async () => {
        const page = await state.pdf.getPage(number); const raw = page.getViewport({ scale: 1, rotation: state.rotation });
        const pageFitWidth = Math.max(250, Math.min(availableWidth(), (scroller.clientHeight - 24) * raw.width / raw.height));
        const width = state.fit === "page" ? pageFitWidth : state.fit === "width" ? availableWidth() : availableWidth() * state.zoom;
        const scale = width / raw.width; slot.style.width = `${scroller.clientWidth}px`; slot.style.height = "100%";
        const canvas = slot.querySelector("canvas"); await renderPage(number, canvas, scale);
        slot.classList.add("rendered"); state.rendered.add(number);
      })().catch((error) => { if (error?.name !== "RenderingCancelledException") status(error?.message || "Page rendering failed"); }).finally(() => state.rendering.delete(number));
      state.rendering.set(number, promise); return promise;
    }
    function renderVisiblePages() { renderAround(state.page); }

    async function renderThumbnails() {
      const fragment = document.createDocumentFragment();
      for (let number = 1; number <= state.pdf.numPages; number += 1) {
        const button = document.createElement("button"); button.type = "button"; button.className = `thumb${number === state.page ? " active" : ""}`; button.dataset.page = number;
        const canvas = document.createElement("canvas"); const label = document.createElement("span"); label.textContent = `Page ${number}`; button.append(canvas, label);
        button.addEventListener("click", () => scrollToPage(number)); fragment.append(button);
      }
      thumbs.append(fragment);
      const thumbObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) if (entry.isIntersecting) {
          const button = entry.target, number = Number(button.dataset.page); thumbObserver.unobserve(button);
          renderPage(number, button.querySelector("canvas"), .2).catch(() => {});
        }
      }, { root: thumbs, rootMargin: "300px" });
      thumbs.querySelectorAll(".thumb").forEach((button) => thumbObserver.observe(button));
    }

    function scrollToPage(number, smooth = true) {
      if (!state.pdf) return; number = Math.min(Math.max(1, Number(number) || 1), state.pdf.numPages);
      const slot = pages.querySelector(`[data-page="${number}"]`); if (!slot) return;
      scroller.scrollTo({ left: (number - 1) * scroller.clientWidth, behavior: smooth ? "smooth" : "instant" }); state.page = number; $("#page-number").value = number;
    }
    async function relayout() {
      if (!state.pdf) return; const previous = state.page; state.rendered.clear(); state.rendering.clear();
      const activeTasks = [...state.pageRenders.values()];
      const activeQueues = [...state.renderQueues.values()];
      for (const task of activeTasks) task.cancel();
      await Promise.allSettled(activeTasks.map((task) => task.promise));
      await Promise.allSettled(activeQueues);
      state.pageRenders.clear();
      state.renderQueues.clear();
      for (const slot of pages.querySelectorAll(".page-slot")) { slot.classList.remove("rendered"); slot.querySelector("canvas").width = 0; slot.querySelector("canvas").height = 0; }
      for (const slot of pages.querySelectorAll(".page-slot")) { slot.style.width = `${scroller.clientWidth}px`; slot.style.height = "100%"; }
      await renderAround(previous); scrollToPage(previous, false);
    }
    async function findNext() {
      if (!state.pdf) return; const query = $("#search").value.trim().toLocaleLowerCase(); if (!query) { status("Enter text to search"); return; }
      if (state.lastQuery !== query) { state.searchMatches = []; state.searchIndex = -1; state.lastQuery = query; status("Searching…");
        for (let number = 1; number <= state.pdf.numPages; number += 1) {
          const content = await (await state.pdf.getPage(number)).getTextContent(); const text = content.items.map((item) => item.str || "").join(" ").toLocaleLowerCase();
          if (text.includes(query)) state.searchMatches.push(number);
        }
      }
      if (!state.searchMatches.length) { status("No matches found"); return; }
      state.searchIndex = (state.searchIndex + 1) % state.searchMatches.length; scrollToPage(state.searchMatches[state.searchIndex]);
      status(`Match ${state.searchIndex + 1} of ${state.searchMatches.length}`);
    }

    $("#close-reader").addEventListener("click", () => setReaderOpen(false));
    $("#thumb-toggle").addEventListener("click", () => { reader.classList.toggle("show-thumbnails"); setTimeout(relayout, 220); });
    $("#prev-page").addEventListener("click", () => scrollToPage(state.page - 1)); $("#next-page").addEventListener("click", () => scrollToPage(state.page + 1));
    $("#page-number").addEventListener("change", (event) => scrollToPage(event.currentTarget.value));
    $("#zoom-in").addEventListener("click", () => { state.fit = "zoom"; state.zoom = Math.min(2.5, state.zoom + .15); $("#zoom-label").textContent = `${Math.round(state.zoom * 100)}%`; relayout(); });
    $("#zoom-out").addEventListener("click", () => { state.fit = "zoom"; state.zoom = Math.max(.45, state.zoom - .15); $("#zoom-label").textContent = `${Math.round(state.zoom * 100)}%`; relayout(); });
    $("#fit-page").addEventListener("click", () => { state.fit = state.fit === "page" ? "width" : "page"; state.zoom = 1; $("#zoom-label").textContent = state.fit === "page" ? "Fit page" : "Fit width"; relayout(); });
    $("#rotate").addEventListener("click", async () => { state.rotation = (state.rotation + 90) % 360; await buildPageSlots(); scrollToPage(state.page, false); renderAround(state.page); });
    $("#find-next").addEventListener("click", findNext); $("#search").addEventListener("keydown", (event) => { if (event.key === "Enter") findNext(); });
    $("#fullscreen").addEventListener("click", () => { if (!document.fullscreenElement) reader.requestFullscreen?.(); else document.exitFullscreen?.(); });
    scroller.addEventListener("wheel", (event) => {
      if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) { event.preventDefault(); scroller.scrollBy({ left: event.deltaY, behavior: "auto" }); }
    }, { passive: false });
    scroller.addEventListener("scroll", () => {
      const max = scroller.scrollWidth - scroller.clientWidth; $("#progress").style.width = `${max > 0 ? (scroller.scrollLeft / max) * 100 : 0}%`;
      const bounds = scroller.getBoundingClientRect(); const center = bounds.left + scroller.clientWidth / 2;
      let closest = null, distance = Infinity;
      for (const slot of pages.querySelectorAll(".page-slot")) { const rect = slot.getBoundingClientRect(); if (rect.right < bounds.left || rect.left > bounds.right) continue; const nextDistance = Math.abs((rect.left + rect.right) / 2 - center); if (nextDistance < distance) { closest = slot; distance = nextDistance; } }
      if (closest) { const page = Number(closest.dataset.page); if (page !== state.page) { state.page = page; $("#page-number").value = page; localStorage.setItem(savedPageKey(state.item.id), String(page)); thumbs.querySelector(".thumb.active")?.classList.remove("active"); thumbs.querySelector(`[data-page="${page}"]`)?.classList.add("active"); renderAround(page); } }
    });
    document.addEventListener("keydown", (event) => {
      if (reader.hidden || event.target.matches("input,textarea,select")) return;
      if (event.key === "Escape") setReaderOpen(false); else if (event.key === "ArrowRight" || event.key === "PageDown") scrollToPage(state.page + 1); else if (event.key === "ArrowLeft" || event.key === "PageUp") scrollToPage(state.page - 1);
    });
    window.addEventListener("resize", () => { if (state.pdf) relayout(); });
    filter.addEventListener("input", drawVolumes); loadVolumes();
  </script>
  <script src="/assets/soundtrack.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080a">
  <meta name="description" content="Browse released Threadboner volumes and read them in the archive reader.">
  <title>Reader · Threadboner</title>
  <style>
    :root{color-scheme:dark;--bg:#08080a;--panel:#101012;--ink:#e7e2d9;--muted:#aaa396;--red:#d92d2d;--line:#302b26;--green:#a7d7ab}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#211313 0,transparent 42%),var(--bg);color:var(--ink);font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
    main{width:min(1120px,100%);margin:auto;padding:clamp(20px,5vw,56px)}header{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px}a{color:var(--ink)}.mark{color:var(--red);font:700 1.1rem Georgia,serif;letter-spacing:.12em;text-decoration:none}.back{font-size:.7rem;color:var(--muted)}h1{font:700 clamp(2rem,7vw,3.4rem)/1.1 Georgia,serif;letter-spacing:.04em;margin:36px 0 8px}.intro{color:var(--muted);max-width:62ch;margin:0 0 28px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:28px 0 14px}.toolbar label{font-size:.65rem;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}input{background:#0c0c0e;border:1px solid var(--line);color:var(--ink);font:inherit;padding:10px 12px;width:min(100%,320px)}button{font:inherit;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}.card{border:1px solid var(--line);background:var(--panel);padding:18px;display:flex;flex-direction:column;min-height:190px}.eyebrow{color:var(--red);font-size:.62rem;letter-spacing:.17em;text-transform:uppercase}.card h2{font:700 1.25rem/1.2 Georgia,serif;margin:10px 0}.date{color:var(--muted);font-size:.72rem;margin:auto 0 16px}.state{font-size:.65rem;color:var(--green);text-transform:uppercase;letter-spacing:.11em}.state.wait{color:#d2b36f}.card button{align-self:flex-start;background:transparent;color:var(--ink);border:1px solid var(--red);padding:8px 12px}.card button:disabled{border-color:var(--line);color:#76716a;cursor:not-allowed}.empty,.error{color:var(--muted);border:1px dashed var(--line);padding:18px}.error{color:#ff8c82}.reader{margin-top:36px;border-top:1px solid var(--line);padding-top:20px}.reader[hidden]{display:none}.reader-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:12px}.reader h2{font:700 1.2rem Georgia,serif}.actions{display:flex;gap:10px}.actions a,.actions button{border:1px solid var(--line);padding:7px 10px;background:transparent;color:var(--ink);font:inherit;font-size:.7rem}.frame{width:100%;height:min(82vh,1000px);min-height:500px;border:1px solid var(--line);background:white}footer{border-top:1px solid var(--line);margin-top:40px;padding-top:18px;color:var(--muted);font-size:.67rem}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}@media(max-width:560px){header,.toolbar,.reader-head{align-items:flex-start;flex-direction:column}.frame{min-height:65vh}}
  </style>
</head>
<body>
  <main>
    <header><a class="mark" href="/">THREADBONER</a><a class="back" href="/">← Back to archive entrance</a></header>
    <h1>The Reader</h1>
    <p class="intro">Released volumes appear here at their scheduled premiere. Select a volume to read the PDF in the site reader.</p>
    <div class="toolbar"><label for="filter">Volume archive</label><input id="filter" type="search" placeholder="Filter by title or volume" autocomplete="off"></div>
    <section id="volumes" class="grid" aria-live="polite" aria-busy="true"><p class="empty">Loading the release archive…</p></section>
    <section id="reader" class="reader" hidden aria-label="PDF reader">
      <div class="reader-head"><h2 id="reader-title"></h2><div class="actions"><a id="open-pdf" target="_blank" rel="noopener">Open PDF</a><button id="close-reader" type="button">Close</button></div></div>
      <iframe id="pdf-frame" class="frame" title="Selected Threadboner volume"></iframe>
    </section>
    <footer>Threadboner © 2026 BiniFn · All Rights Reserved</footer>
  </main>
  <script>
    (() => {
      const list = document.querySelector("#volumes");
      const filter = document.querySelector("#filter");
      const reader = document.querySelector("#reader");
      const frame = document.querySelector("#pdf-frame");
      const selected = { releases: [] };
      const prettyDate = (date) => new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" }).format(new Date(date));

      function draw() {
        const query = filter.value.trim().toLowerCase();
        const rows = selected.releases.filter((item) => (`volume ${item.volumeNumber} ${item.title}`).toLowerCase().includes(query));
        if (!rows.length) {
          list.innerHTML = `<p class="empty">${selected.releases.length ? "No volumes match that filter." : "No volumes have premiered yet. Check back when the first release opens."}</p>`;
          return;
        }
        list.replaceChildren(...rows.map((item) => {
          const card = document.createElement("article");
          card.className = "card";
          const eyebrow = document.createElement("div");
          eyebrow.className = "eyebrow";
          eyebrow.textContent = `Volume ${item.volumeNumber}`;
          const title = document.createElement("h2");
          title.textContent = item.title;
          const date = document.createElement("p");
          date.className = "date";
          date.textContent = `Premieres ${prettyDate(item.premiereAt)}`;
          const state = document.createElement("p");
          state.className = `state${item.released ? "" : " wait"}`;
          state.textContent = item.released ? "Available to read" : "Scheduled";
          const button = document.createElement("button");
          button.type = "button";
          button.disabled = !item.released;
          button.textContent = item.released ? "Read volume" : "Not released yet";
          button.addEventListener("click", () => openVolume(item));
          card.append(eyebrow, title, date, state, button);
          return card;
        }));
      }

      async function load() {
        list.setAttribute("aria-busy", "true");
        try {
          const response = await fetch("/api/reader/volumes", { cache: "no-store" });
          const result = await response.json().catch(() => ({}));
          if (!response.ok || !result.success) throw new Error(result.error || "Could not load releases.");
          selected.releases = result.data.releases || [];
          draw();
        } catch (error) {
          list.replaceChildren(Object.assign(document.createElement("p"), { className: "error", textContent: error?.message || "Reader unavailable." }));
        } finally {
          list.setAttribute("aria-busy", "false");
        }
      }

      async function openVolume(item) {
        const button = [...list.querySelectorAll("button")].find((candidate) => candidate.textContent === "Read volume" && candidate.closest(".card")?.querySelector("h2")?.textContent === item.title);
        if (button) { button.disabled = true; button.textContent = "Opening…"; }
        try {
          const response = await fetch(`/api/reader/volumes?id=${encodeURIComponent(item.id)}`, { cache: "no-store" });
          const result = await response.json().catch(() => ({}));
          if (!response.ok || !result.success) throw new Error(result.error || "This volume is not available yet.");
          const volume = result.data.volume;
          reader.hidden = false;
          document.querySelector("#reader-title").textContent = `Volume ${volume.volumeNumber} · ${volume.title}`;
          frame.src = volume.url;
          document.querySelector("#open-pdf").href = volume.url;
          reader.scrollIntoView({ behavior: "smooth", block: "start" });
        } catch (error) {
          window.alert(error?.message || "Could not open this volume.");
        } finally {
          if (button) { button.disabled = false; button.textContent = "Read volume"; }
        }
      }

      document.querySelector("#close-reader").addEventListener("click", () => {
        reader.hidden = true;
        frame.removeAttribute("src");
        document.querySelector("#open-pdf").removeAttribute("href");
      });
      filter.addEventListener("input", draw);
      window.addEventListener("focus", load);
      load();
    })();
  </script>
</body>
</html>
